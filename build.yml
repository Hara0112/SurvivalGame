name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot + Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mv debug.keystore /root/debug.keystore
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which java))))
          echo "Java path: $JAVA_PATH"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/$f
            echo '[resource]' >> ~/.config/godot/$f
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"' >> ~/.config/godot/$f
            echo "export/android/java_sdk_path = \"$JAVA_PATH\"" >> ~/.config/godot/$f
            echo 'export/android/debug_keystore = "/root/debug.keystore"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/$f
            echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/$f
            echo 'export/android/force_system_user = false' >> ~/.config/godot/$f
            echo 'export/android/shutdown_adb_on_exit = true' >> ~/.config/godot/$f
          done
      - name: Tai am thanh CC0 Kenney
        run: |
          mkdir -p audio
          wget -q -O /tmp/impact.zip "https://github.com/Loppansson/kenney-impact-sounds-for-godot/archive/999dd1684873f8b020a3aa5b26e713da21688924.zip" || echo "Khong tai duoc am thanh"
          unzip -q -o /tmp/impact.zip -d /tmp/impact || echo "Khong giai nen duoc"
          find /tmp/impact -type f \( -iname 'footstep_*.ogg' -o -iname 'impactWood*.ogg' -o -iname 'impactMining*.ogg' -o -iname 'impactMetal*.ogg' -o -iname 'impactPlate*.ogg' -o -iname 'impactPunch*.ogg' \) -exec cp {} audio/ \; || true
          if [ -z "$(ls audio 2>/dev/null | grep -i '^footstep_')" ]; then
            find /tmp/impact -type f \( -iname 'footstep_*.wav' -o -iname 'impactWood*.wav' -o -iname 'impactMining*.wav' -o -iname 'impactMetal*.wav' -o -iname 'impactPlate*.wav' -o -iname 'impactPunch*.wav' \) -exec cp {} audio/ \; || true
          fi
          ls audio | head -60
      - name: Import + Export APK
        run: |
          mkdir -p build
          godot --headless --import || true
          godot --headless --export-debug "Android" build/SurvivalGame.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SurvivalGame-apk
          path: build/SurvivalGame.apk
